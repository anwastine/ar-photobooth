<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b2545">
<title>AR Photobooth · Live</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  :root{--navy:#0b2545;--gold:#c9a227;--gold2:#e8c874;--cream:#f6efe0}
  html,body{margin:0;height:100%;background:#061428;color:var(--cream);font-family:Inter,system-ui,sans-serif;overflow:hidden}
  #app{position:fixed;inset:0}
  a-scene{position:absolute;inset:0}
  .ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:max(14px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));z-index:5}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .badge{display:inline-flex;align-items:center;gap:8px;background:rgba(6,20,40,.6);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;pointer-events:auto}
  .badge .dot{width:8px;height:8px;border-radius:50%;background:#f0b429;box-shadow:0 0 12px #f0b429}
  .badge.found .dot{background:#3ddc84;box-shadow:0 0 12px #3ddc84}
  .bottom{display:flex;justify-content:center;gap:12px;pointer-events:none}
  .rbtn{pointer-events:auto;appearance:none;border:1px solid rgba(255,255,255,.18);background:rgba(6,20,40,.6);backdrop-filter:blur(10px);color:var(--cream);border-radius:999px;padding:12px 18px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
  .rbtn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--navy);border-color:transparent}
  .shutter{width:68px;height:68px;border-radius:50%;padding:0;justify-content:center;border:4px solid #fff;background:rgba(255,255,255,.2)}
  .shutter i{width:52px;height:52px;border-radius:50%;background:#fff;display:block}
  /* start / intro */
  #intro{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:radial-gradient(1000px 700px at 50% -10%,#1b3f73 0%,var(--navy) 45%,#061428 100%);padding:24px;text-align:center}
  #intro .box{max-width:460px;display:flex;flex-direction:column;align-items:center;gap:16px}
  #intro img{width:100%;max-width:440px;border-radius:12px;background:#fff;box-shadow:0 30px 80px rgba(0,0,0,.6)}
  #intro h1{font-family:'Playfair Display',serif;font-size:30px;margin:6px 0 0;line-height:1.1}
  #intro p{margin:0;color:#c9d3e3;line-height:1.5;font-size:15px}
  #intro .big{appearance:none;border:0;border-radius:999px;padding:18px 40px;font-size:19px;font-weight:700;background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--navy);box-shadow:0 12px 40px rgba(201,162,39,.45);cursor:pointer}
  #intro .sm{color:#8a94a6;font-size:12px}
  #intro .sm a{color:var(--gold2)}
  #intro.hide{display:none}
  /* scanning hint (MindAR toggles inline display) */
  #scanning{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;gap:14px}
  #scanning .target{width:min(78vw,520px);aspect-ratio:3/1;border:2px dashed rgba(232,200,116,.85);border-radius:10px;position:relative;box-shadow:0 0 0 999px rgba(6,20,40,.25)}
  #scanning .target:before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,#fff,transparent);animation:scan 2.2s ease-in-out infinite}
  @keyframes scan{0%{top:0}50%{top:calc(100% - 2px)}100%{top:0}}
  #scanning .txt{background:rgba(6,20,40,.65);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:600}
  #toast{position:fixed;left:50%;top:18%;transform:translateX(-50%) translateY(-10px);z-index:6;background:rgba(6,20,40,.7);backdrop-filter:blur(10px);border:1px solid rgba(232,200,116,.5);border-radius:14px;padding:12px 18px;font-weight:600;opacity:0;transition:.3s;pointer-events:none;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #err{position:fixed;inset:auto 16px 90px;z-index:30;background:#7a1f1f;border-radius:12px;padding:12px 14px;font-size:14px;display:none}
  .mindar-ui-overlay,.a-enter-vr,.a-enter-ar{display:none !important}
  [hidden]{display:none !important}
  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9}
  #flash.go{animation:fl .5s ease-out}@keyframes fl{0%{opacity:.9}100%{opacity:0}}
</style>
</head>
<body>
<div id="app"></div>

<div id="intro">
  <div class="box">
    <img src="assets/overlay.jpg" alt="The banner to scan">
    <h1>Bring your photo to life</h1>
    <p>Allow the camera, then point your phone at the <b>blue &amp; gold banner</b> printed under your photo. The ship sails, the birds fly, the cap flies… ✨</p>
    <button class="big" id="btnStart">Start camera</button>
    <div class="sm">No camera? <a href="ar?preview=1">Watch the preview</a> · <a href="./">Photobooth</a></div>
  </div>
</div>

<div id="scanning" style="display:none">
  <div class="target"></div>
  <div class="txt">Point at the printed banner</div>
</div>

<div class="ui">
  <div class="top">
    <div class="badge" id="status"><span class="dot"></span><span id="statusTxt">Starting…</span></div>
    <a class="rbtn" href="./" style="text-decoration:none">📸 Booth</a>
  </div>
  <div class="bottom">
    <button class="rbtn" id="btnReplay" title="Replay animation">↻ Replay</button>
    <button class="rbtn shutter" id="btnSnap" title="Capture"><i></i></button>
    <button class="rbtn" id="btnMute" title="Sound" hidden>🔊</button>
  </div>
</div>
<div id="toast"></div>
<div id="err"></div>
<div id="flash"></div>

<script>
/* ============================================================
   Scene definition. Image space: 1600 x 533 px  ->  1 unit wide
   ============================================================ */
const IMG_W = 1600, IMG_H = 533;
const U = px => px / IMG_W;                       // px -> world units
const X = px => px / IMG_W - 0.5;                 // image x -> world x
const Y = px => (IMG_H / 2 - px) / IMG_W;         // image y -> world y (up)
const PREVIEW = new URLSearchParams(location.search).has('preview');

const LAYERS = {  // cut-out boxes from the banner, produced by tools/extract.py
  ship:   [1186,138,1472,404],
  compass:[366,238,508,406],
  rose:   [388,274,492,378],
  cap:    [76,168,304,294],
  bird1:  [992,262,1034,290],
  bird2:  [1038,250,1080,276],
  bird3:  [1088,282,1126,304],
  bird4:  [1450,268,1486,292],
};
const LAMP = [1522,237];                          // lighthouse lamp
const BOOK = [330,352];                           // open book
const PATHS = [                                   // gold dotted paths (quadratic beziers)
  [[232,205],[340,165],[478,282]],
  [[1116,320],[1150,255],[1258,205]],
  [[1328,196],[1420,196],[1500,242]],
];
const RIBBON = [[0,335],[120,322],[250,335],[400,380],[560,405],[700,393],[850,380],[1000,400],[1150,432],[1300,425],[1400,395],[1520,360],[1600,340]];
const SKY = [[735,318],[985,288],[1055,300],[610,282],[1175,312],[905,326]];

// ---------- procedural textures ----------
function tex(id, w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const img = new Image(); img.id = id; img.src = c.toDataURL('image/png'); return img;
}
const T = {
  sparkle: tex('t-sparkle', 96, 96, (x, w, h) => {
    const g = x.createRadialGradient(48, 48, 0, 48, 48, 48); g.addColorStop(0, 'rgba(255,240,190,1)'); g.addColorStop(.25, 'rgba(232,200,116,.55)'); g.addColorStop(1, 'rgba(232,200,116,0)');
    x.fillStyle = g; x.fillRect(0, 0, w, h);
    x.fillStyle = 'rgba(255,250,225,.95)'; x.beginPath();
    for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, r = i % 2 ? 6 : 46; x.lineTo(48 + Math.cos(a) * r, 48 + Math.sin(a) * r); }
    x.closePath(); x.fill();
  }),
  glow: tex('t-glow', 128, 128, (x, w, h) => {
    const g = x.createRadialGradient(64, 64, 0, 64, 64, 64); g.addColorStop(0, 'rgba(255,245,210,1)'); g.addColorStop(.3, 'rgba(255,220,140,.6)'); g.addColorStop(1, 'rgba(255,200,100,0)');
    x.fillStyle = g; x.fillRect(0, 0, w, h);
  }),
  dot: tex('t-dot', 64, 64, (x, w, h) => {
    const g = x.createRadialGradient(32, 32, 0, 32, 32, 32); g.addColorStop(0, 'rgba(255,235,170,1)'); g.addColorStop(.35, 'rgba(232,190,90,.9)'); g.addColorStop(.6, 'rgba(201,162,39,.35)'); g.addColorStop(1, 'rgba(201,162,39,0)');
    x.fillStyle = g; x.fillRect(0, 0, w, h);
  }),
  beam: tex('t-beam', 512, 160, (x, w, h) => {
    const g = x.createLinearGradient(0, 0, w, 0); g.addColorStop(0, 'rgba(255,240,200,.85)'); g.addColorStop(.35, 'rgba(255,230,170,.35)'); g.addColorStop(1, 'rgba(255,220,150,0)');
    x.fillStyle = g; x.beginPath(); x.moveTo(0, h / 2 - 6); x.lineTo(w, 0); x.lineTo(w, h); x.lineTo(0, h / 2 + 6); x.closePath(); x.fill();
  }),
  ring: tex('t-ring', 128, 128, (x, w, h) => {
    x.strokeStyle = 'rgba(232,200,116,.9)'; x.lineWidth = 6; x.beginPath(); x.arc(64, 64, 56, 0, Math.PI * 2); x.stroke();
  }),
};

// ---------- helpers ----------
const ease = { outCubic: u => 1 - Math.pow(1 - u, 3), inQuad: u => u * u, outQuad: u => 1 - (1 - u) * (1 - u), inOut: u => u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2 };
const clamp01 = v => Math.max(0, Math.min(1, v));
function bez(p, t) { const a = 1 - t; return [a * a * p[0][0] + 2 * a * t * p[1][0] + t * t * p[2][0], a * a * p[0][1] + 2 * a * t * p[1][1] + t * t * p[2][1]]; }
function ribbonAt(u) { const n = RIBBON.length - 1, f = u * n, i = Math.min(n - 1, Math.floor(f)), k = f - i; return [RIBBON[i][0] + (RIBBON[i + 1][0] - RIBBON[i][0]) * k, RIBBON[i][1] + (RIBBON[i + 1][1] - RIBBON[i][1]) * k]; }
let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;

// Shared clock: animations restart on "Replay" and when the target is (re)found
const CLOCK = { t0: performance.now(), now: () => (performance.now() - CLOCK.t0) / 1000, reset() { this.t0 = performance.now(); } };
const CAP_PERIOD = 8;
function capPhase() { return CLOCK.now() % CAP_PERIOD; }

// ---------- components ----------
AFRAME.registerComponent('ship-sail', {
  init() { this.base = this.el.object3D.position.clone(); },
  tick() { const s = CLOCK.now(), o = this.el.object3D;
    const lift = ease.outCubic(clamp01(s / 1.6));                    // rises off the page on start
    o.position.z = this.base.z + 0.035 * lift + Math.sin(s * 0.9) * 0.004;
    o.position.y = this.base.y + Math.sin(s * 1.6) * 0.006 * lift;
    o.position.x = this.base.x + Math.sin(s * 0.28) * 0.02 * lift;
    o.rotation.z = THREE.MathUtils.degToRad(Math.sin(s * 1.25) * 3.2 * lift);
    o.rotation.y = THREE.MathUtils.degToRad(Math.sin(s * 0.28) * 9 * lift);
  }
});
AFRAME.registerComponent('bird-fly', {
  schema: { ax: { default: 0.09 }, ay: { default: 0.04 }, speed: { default: 0.55 }, phase: { default: 0 }, flap: { default: 11 } },
  init() { this.base = this.el.object3D.position.clone(); this.sx = this.el.object3D.scale.x; this.sy = this.el.object3D.scale.y; this.lastX = 0; },
  tick() { const d = this.data, s = CLOCK.now(), o = this.el.object3D;
    const lift = ease.outCubic(clamp01((s - 0.4) / 1.5)), w = s * d.speed + d.phase;
    const x = Math.sin(w) * d.ax, y = Math.sin(2 * w) * d.ay + 0.05 * lift + Math.sin(s * 2.2 + d.phase) * 0.004;
    o.position.set(this.base.x + x * lift, this.base.y + y, this.base.z + (0.03 + 0.03 * Math.sin(w + 1)) * lift);
    const dx = Math.cos(w); // heading
    o.scale.x = this.sx * (dx < 0 ? -1 : 1);
    o.scale.y = this.sy * (0.55 + 0.45 * Math.abs(Math.cos(s * d.flap + d.phase)));
    o.rotation.z = THREE.MathUtils.degToRad(Math.cos(2 * w) * 12 * lift * (dx < 0 ? -1 : 1));
  }
});
AFRAME.registerComponent('cap-toss', {
  init() { this.base = this.el.object3D.position.clone(); },
  tick() { const p = capPhase(), o = this.el.object3D; let y = 0, rotY = 0, z = 0, rotZ = 0, sc = 1;
    if (p < 1.6) { const u = p / 1.6; rotZ = Math.sin(u * Math.PI * 3) * 3 * u; sc = 1 + 0.03 * Math.sin(u * Math.PI); } // little wiggle
    else if (p < 3.0) { const u = (p - 1.6) / 1.4; y = 0.17 * ease.outQuad(u); rotY = 720 * ease.outCubic(u); z = 0.08 * Math.sin(u * Math.PI / 2); rotZ = -8 * u; }
    else if (p < 3.8) { const u = (p - 3.0) / 0.8; y = 0.17 + Math.sin(u * Math.PI) * 0.006; rotY = 720 + 90 * u; z = 0.08; rotZ = -8 + 8 * u; }
    else if (p < 5.0) { const u = (p - 3.8) / 1.2; y = 0.17 * (1 - ease.inQuad(u)); rotY = 810 + 270 * ease.inOut(u); z = 0.08 * (1 - ease.inQuad(u)); rotZ = 6 * Math.sin(u * Math.PI); }
    else if (p < 5.5) { const u = (p - 5.0) / 0.5; sc = 1 + 0.08 * Math.sin(u * Math.PI) * (1 - u); rotZ = -4 * Math.sin(u * Math.PI * 2) * (1 - u); }  // landing squash
    o.position.set(this.base.x, this.base.y + y, this.base.z + z);
    o.rotation.set(0, THREE.MathUtils.degToRad(rotY), THREE.MathUtils.degToRad(rotZ));
    o.scale.set(sc, 2 - sc, 1);
  }
});
AFRAME.registerComponent('compass-float', {
  init() { this.base = this.el.object3D.position.clone(); },
  tick() { const s = CLOCK.now(), o = this.el.object3D, lift = ease.outCubic(clamp01((s - 0.2) / 1.4));
    o.position.z = this.base.z + 0.04 * lift + Math.sin(s * 1.1) * 0.004 * lift;
    o.position.y = this.base.y + Math.sin(s * 0.9) * 0.003 * lift;
    o.rotation.x = THREE.MathUtils.degToRad(Math.sin(s * 0.8) * 9 * lift);
    o.rotation.y = THREE.MathUtils.degToRad(Math.cos(s * 0.6) * 12 * lift);
  }
});
AFRAME.registerComponent('rose-spin', {
  tick() { const s = CLOCK.now(), c = 6, p = s % c, u = p / c; let a;
    if (u < 0.55) a = 720 * ease.outCubic(u / 0.55);                    // spins twice…
    else a = 720 + Math.sin((u - 0.55) / 0.45 * Math.PI * 4) * 14 * (1 - (u - 0.55) / 0.45); // …then settles like a needle
    this.el.object3D.rotation.z = -THREE.MathUtils.degToRad(a);
  }
});
AFRAME.registerComponent('beam-sweep', {
  init() { this.mat = null; },
  tick() { const s = CLOCK.now(), o = this.el.object3D;
    o.rotation.z = THREE.MathUtils.degToRad(Math.sin(s * 0.55) * 22 + 2);
    const m = this.el.querySelector('a-plane')?.getObject3D('mesh')?.material; if (m) m.opacity = 0.55 + 0.35 * Math.sin(s * 2.1) * Math.sin(s * 0.55);
  }
});
AFRAME.registerComponent('pulse', {
  schema: { speed: { default: 2 }, min: { default: 0.8 }, max: { default: 1.25 }, phase: { default: 0 } },
  tick() { const d = this.data, s = CLOCK.now(), k = d.min + (d.max - d.min) * (0.5 + 0.5 * Math.sin(s * d.speed + d.phase)); this.el.object3D.scale.set(k, k, 1);
    const m = this.el.getObject3D('mesh')?.material; if (m) m.opacity = 0.55 + 0.45 * (k - d.min) / (d.max - d.min); }
});
AFRAME.registerComponent('path-dot', {
  schema: { path: { default: 0 }, offset: { default: 0 }, dur: { default: 3.2 } },
  tick() { const d = this.data, s = CLOCK.now(), u = ((s / d.dur) + d.offset) % 1, p = bez(PATHS[d.path], u), o = this.el.object3D;
    o.position.set(X(p[0]), Y(p[1]), 0.012 + 0.01 * Math.sin(u * Math.PI));
    const k = 0.6 + 0.8 * Math.sin(u * Math.PI); o.scale.set(k, k, 1);
    const m = this.el.getObject3D('mesh')?.material; if (m) m.opacity = Math.sin(u * Math.PI); }
});
AFRAME.registerComponent('twinkle', {
  schema: { speed: { default: 3 }, phase: { default: 0 }, drift: { default: 0.004 } },
  init() { this.base = this.el.object3D.position.clone(); this.s0 = this.el.object3D.scale.x; },
  tick() { const d = this.data, s = CLOCK.now(), v = Math.pow(0.5 + 0.5 * Math.sin(s * d.speed + d.phase), 3), o = this.el.object3D;
    o.scale.set(this.s0 * (0.3 + v), this.s0 * (0.3 + v), 1); o.rotation.z = s * 0.4 + d.phase;
    o.position.y = this.base.y + Math.sin(s * 0.7 + d.phase) * d.drift;
    const m = this.el.getObject3D('mesh')?.material; if (m) m.opacity = 0.15 + 0.85 * v; }
});
AFRAME.registerComponent('rise', {   // knowledge particles rising from the open book
  schema: { dur: { default: 3.5 }, offset: { default: 0 }, sway: { default: 0.01 } },
  init() { this.base = this.el.object3D.position.clone(); this.s0 = this.el.object3D.scale.x; },
  tick() { const d = this.data, s = CLOCK.now(), u = ((s / d.dur) + d.offset) % 1, o = this.el.object3D;
    o.position.set(this.base.x + Math.sin(u * 6 + d.offset * 20) * d.sway, this.base.y + u * 0.13, this.base.z + 0.02 + u * 0.05);
    const k = this.s0 * (1.2 - u); o.scale.set(k, k, 1);
    const m = this.el.getObject3D('mesh')?.material; if (m) m.opacity = Math.sin(u * Math.PI) * 0.9; }
});
AFRAME.registerComponent('confetti', {  // bursts when the cap reaches its apex
  schema: { vx: { default: 0 }, vy: { default: 0 }, spin: { default: 0 }, delay: { default: 0 } },
  init() { this.origin = this.el.object3D.position.clone(); },
  tick() { const d = this.data, p = capPhase() - 3.0 - d.delay, o = this.el.object3D;
    if (p < 0 || p > 2.6) { o.visible = false; return; } o.visible = true;
    o.position.set(this.origin.x + d.vx * p, this.origin.y + d.vy * p - 0.09 * p * p, this.origin.z + 0.08 + 0.03 * p);
    o.rotation.set(p * d.spin, p * d.spin * 0.7, p * d.spin * 1.3);
    const m = this.el.getObject3D('mesh')?.material; if (m) m.opacity = clamp01((2.6 - p) / 0.6); }
});
AFRAME.registerComponent('wave-shimmer', {  // soft gold shimmer sliding along the ribbon
  tick() { const s = CLOCK.now(), m = this.el.getObject3D('mesh')?.material; if (!m) return; m.opacity = 0.25 + 0.2 * Math.sin(s * 1.3);
    this.el.object3D.position.x = Math.sin(s * 0.5) * 0.02; }
});

// ---------- build scene ----------
function layerPlane(name, z, extra = '') {
  const [x0, y0, x1, y1] = LAYERS[name];
  return `<a-plane src="#img-${name}" width="${U(x1 - x0)}" height="${U(y1 - y0)}" position="${X((x0 + x1) / 2)} ${Y((y0 + y1) / 2)} ${z}"
            material="shader: flat; transparent: true; alphaTest: 0.02; side: double" ${extra}></a-plane>`;
}
function sprite(texId, x, y, z, size, extra = '', blend = 'normal') {
  return `<a-plane src="#${texId}" width="${size}" height="${size}" position="${x} ${y} ${z}" material="shader: flat; transparent: true; opacity: 0.9; depthWrite: false; blending: ${blend}" ${extra}></a-plane>`;
}
function buildContent() {
  let h = '';
  // ship
  h += layerPlane('ship', 0.001, 'ship-sail');
  // birds
  const birdCfg = [[0.55, 0], [0.5, 2.1], [0.62, 4.2], [0.48, 1.0]];
  ['bird1', 'bird2', 'bird3', 'bird4'].forEach((b, i) => { h += layerPlane(b, 0.002, `bird-fly="speed: ${birdCfg[i][0]}; phase: ${birdCfg[i][1]}; ax: ${0.07 + i * 0.012}; ay: ${0.03 + i * 0.006}"`); });
  // cap + confetti
  h += layerPlane('cap', 0.002, 'cap-toss');
  const [cx0, cy0, cx1, cy1] = LAYERS.cap; const capX = X((cx0 + cx1) / 2), capY = Y((cy0 + cy1) / 2) + 0.17;
  const cols = ['#c9a227', '#e8c874', '#0b2545', '#f6efe0', '#1f5a9a'];
  for (let i = 0; i < 34; i++) { const a = rnd() * Math.PI * 2, v = 0.05 + rnd() * 0.09;
    h += `<a-plane width="0.007" height="0.0045" position="${capX} ${capY} 0" material="shader: flat; color: ${cols[i % cols.length]}; transparent: true; side: double" confetti="vx: ${Math.cos(a) * v}; vy: ${Math.abs(Math.sin(a)) * v + 0.04}; spin: ${4 + rnd() * 8}; delay: ${rnd() * 0.25}"></a-plane>`; }
  // compass + rose
  const [kx0, ky0, kx1, ky1] = LAYERS.compass; const [rx0, ry0, rx1, ry1] = LAYERS.rose;
  const kcx = X((kx0 + kx1) / 2), kcy = Y((ky0 + ky1) / 2);
  h += `<a-entity position="${kcx} ${kcy} 0.001" compass-float>
          <a-plane src="#img-compass" width="${U(kx1 - kx0)}" height="${U(ky1 - ky0)}" material="shader: flat; transparent: true; alphaTest: 0.02; side: double"></a-plane>
          <a-plane src="#img-rose" width="${U(rx1 - rx0)}" height="${U(ry1 - ry0)}" position="${X((rx0 + rx1) / 2) - kcx} ${Y((ry0 + ry1) / 2) - kcy} 0.004" material="shader: flat; transparent: true; alphaTest: 0.02; side: double" rose-spin></a-plane>
          ${sprite('t-ring', X(440) - kcx, Y(335) - kcy, 0.006, 0.1, 'pulse="speed: 1.6; min: 0.9; max: 1.35"')}
        </a-entity>`;
  // lighthouse beam + lamp glow
  h += `<a-entity position="${X(LAMP[0])} ${Y(LAMP[1])} 0.008" beam-sweep>
          <a-plane src="#t-beam" width="0.2" height="0.065" position="0.1 0 0" material="shader: flat; transparent: true; opacity: 0.7; depthWrite: false; side: double"></a-plane>
        </a-entity>`;
  h += sprite('t-glow', X(LAMP[0]), Y(LAMP[1]), 0.01, 0.06, 'pulse="speed: 2.4; min: 0.7; max: 1.3"');
  // travelling dots on the golden paths
  PATHS.forEach((p, i) => { for (let k = 0; k < 3; k++) h += sprite('t-dot', 0, 0, 0.01, 0.017, `path-dot="path: ${i}; offset: ${k / 3 + i * 0.11}; dur: ${3 + i * 0.4}"`); });
  // sparkles along the gold ribbon + on the skyline
  for (let i = 0; i < 34; i++) { const p = ribbonAt(rnd()); const s = 0.014 + rnd() * 0.018;
    h += sprite('t-sparkle', X(p[0] + (rnd() - 0.5) * 30), Y(p[1] + (rnd() - 0.5) * 22), 0.006 + rnd() * 0.01, s, `twinkle="speed: ${2 + rnd() * 3}; phase: ${rnd() * 6.3}"`); }
  SKY.forEach((p, i) => { h += sprite('t-sparkle', X(p[0]), Y(p[1]), 0.008, 0.022, `twinkle="speed: ${1.8 + i * 0.3}; phase: ${i * 1.1}; drift: 0.002"`); });
  // knowledge particles from the book
  for (let i = 0; i < 16; i++) h += sprite('t-dot', X(BOOK[0] + (rnd() - 0.5) * 90), Y(BOOK[1] + (rnd() - 0.5) * 20), 0.005, 0.012 + rnd() * 0.012, `rise="dur: ${2.8 + rnd() * 2.2}; offset: ${rnd()}; sway: ${0.006 + rnd() * 0.01}"`);
  return h;
}
function buildAssets() {
  let a = '<a-assets timeout="8000">';
  for (const n in LAYERS) a += `<img id="img-${n}" src="assets/${n}.png" crossorigin="anonymous">`;
  a += `<img id="img-overlay" src="assets/overlay.jpg" crossorigin="anonymous">`;
  for (const k in T) a += T[k].outerHTML;
  return a + '</a-assets>';
}
function buildScene() {
  const content = buildContent();
  let s;
  if (PREVIEW) {
    s = `<a-scene renderer="colorManagement: true; alpha: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" background="color: #0b2545">
      ${buildAssets()}
      <a-entity camera="fov: 45" position="0 0 ${Math.max(0.75, 1.2 / (2 * Math.tan(Math.PI / 8) * (innerWidth / innerHeight))).toFixed(3)}" look-controls="enabled: false" wasd-controls="enabled: false"></a-entity>
      <a-entity id="target" position="0 0 0" preview-orbit>
        <a-plane src="#img-overlay" width="1" height="${IMG_H / IMG_W}" material="shader: flat"></a-plane>
        ${content}
      </a-entity>
    </a-scene>`;
  } else {
    s = `<a-scene mindar-image="imageTargetSrc: targets/overlay.mind; autoStart: false; uiLoading: no; uiError: no; uiScanning: #scanning; filterMinCF: 0.0005; filterBeta: 0.02; missTolerance: 8; warmupTolerance: 3"
             color-space="sRGB" renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      ${buildAssets()}
      <a-camera position="0 0 0" look-controls="enabled: false" wasd-controls="enabled: false"></a-camera>
      <a-entity id="target" mindar-image-target="targetIndex: 0">${content}</a-entity>
    </a-scene>`;
  }
  document.getElementById('app').innerHTML = s;
  return document.querySelector('a-scene');
}
AFRAME.registerComponent('preview-orbit', {  // gentle 3D sway in preview mode so depth is visible
  tick() { const s = CLOCK.now(), o = this.el.object3D; o.rotation.y = Math.sin(s * 0.35) * 0.35; o.rotation.x = Math.sin(s * 0.22) * 0.18; }
});

// ---------- UI ----------
const $ = id => document.getElementById(id);
const toast = (msg, ms = 2200) => { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), ms); };
const setStatus = (txt, found) => { $('statusTxt').textContent = txt; $('status').classList.toggle('found', !!found); };
const showErr = msg => { const e = $('err'); e.textContent = msg; e.style.display = 'block'; };

const sceneEl = buildScene();
$('btnReplay').onclick = () => { CLOCK.reset(); toast('↻ Replaying'); };

if (PREVIEW) {
  $('intro').classList.add('hide'); $('scanning').style.display = 'none';
  setStatus('Preview mode · no camera', true);
  $('btnSnap').hidden = true;
} else {
  const arSystem = () => sceneEl.systems['mindar-image-system'];
  let renderStarted = new Promise(r => sceneEl.addEventListener('renderstart', r, { once: true }));
  $('btnStart').onclick = async () => {
    $('btnStart').disabled = true; $('btnStart').textContent = 'Starting…';
    try { await renderStarted; arSystem().start(); }
    catch (e) { showErr('Could not start the camera: ' + (e.message || e)); $('btnStart').disabled = false; $('btnStart').textContent = 'Try again'; }
  };
  sceneEl.addEventListener('arReady', () => { $('intro').classList.add('hide'); setStatus('Looking for the banner…'); });
  sceneEl.addEventListener('arError', e => { showErr('AR could not start. Use Safari (iPhone) or Chrome (Android) over HTTPS and allow the camera. ' + (e?.detail?.error || '')); $('btnStart').disabled = false; $('btnStart').textContent = 'Try again'; });
  const target = document.getElementById('target');
  let firstFind = true;
  target.addEventListener('targetFound', () => { CLOCK.reset(); setStatus('Banner found ✨', true); if (firstFind) { toast('✨ It\'s alive! Hold steady and watch', 2600); firstFind = false; } });
  target.addEventListener('targetLost', () => setStatus('Looking for the banner…'));

  // capture a still (video + AR layer composited)
  $('btnSnap').onclick = async () => {
    try {
      const video = document.querySelector('video'), canvas = sceneEl.canvas;
      const W = window.innerWidth, H = window.innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
      const c = document.createElement('canvas'); c.width = W * dpr; c.height = H * dpr; const x = c.getContext('2d'); x.scale(dpr, dpr);
      if (video) { const r = video.getBoundingClientRect(); x.drawImage(video, r.left, r.top, r.width, r.height); }
      sceneEl.renderer.render(sceneEl.object3D, sceneEl.camera);   // fresh frame so the WebGL buffer is readable
      x.drawImage(canvas, 0, 0, W, H);
      $('flash').classList.remove('go'); void $('flash').offsetWidth; $('flash').classList.add('go');
      const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.92));
      const file = new File([blob], `ar-photobooth-${Date.now()}.jpg`, { type: 'image/jpeg' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'AR Photobooth' }); }
      else { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name; a.click(); toast('Saved'); }
    } catch (e) { if (e.name !== 'AbortError') toast('Could not capture: ' + e.message); }
  };
}
</script>
</body>
